[package]
name = 'shoal'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.81'

[lib]
crate-type = [ 'staticlib' ]
name = 'shoal'

[dependencies]
extendr-api = '0.8.1'
kodama = '0.3'
linfa = { version = '0.8.1', default-features = false }
linfa-clustering = { version = '0.8.1', default-features = false }
# petal-* are on ndarray 0.17 and linfa is on 0.16, so both are in the tree.
# The alias keeps which is which explicit at every call site.
ndarray = '0.17'
ndarray_linfa = { package = 'ndarray', version = '0.16' }
petal-clustering = '0.13'
petal-neighbors = '0.18'
rand_xoshiro = '0.6'
rayon = '1'

[profile.release]
lto = true
codegen-units = 1
