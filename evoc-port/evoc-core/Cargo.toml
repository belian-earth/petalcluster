[package]
name = "evoc-core"
version = "0.0.1"
edition = "2021"
rust-version = "1.81"
publish = false
description = "Dependency-free Rust port of the EVoC clustering pipeline, validated against fixtures generated from the Python reference (TutteInstitute/evoc 0.3.1)."
license = "Apache-2.0 AND BSD-2-Clause"

# rayon is the sole runtime dependency, and it is already vendored in shoal's
# tree, so the eventual integration adds nothing to the CRAN size budget.
# Staying otherwise std-only keeps this crate testable without libR, unlike
# the extendr-linked shoal crate.
[dependencies]
rayon = "1"

[dev-dependencies]
serde_json = "1"
